[probe]
# The server was selected by the initial eth0-bound test on 2026-09-25.
# Fixing it keeps the long-term series comparable; a server outage is recorded
# as a failed probe rather than silently switching to another server.
speedtest_binary = "/usr/bin/speedtest"
interface = "eth0"
server_id = 48463
server_name = "IPA CyberLab 400G"
server_location = "Tokyo, Japan"
timeout_seconds = 120
metrics_directory = "/mnt/data/pi_monitor/data/node-exporter/textfile"
metrics_filename = "internet-speed.prom"
