[project]
name = "pi-ssd-smart-probe"
version = "0.1.0"
description = "Low-frequency SMART probe for the Raspberry Pi external SSD"
requires-python = ">=3.11"
dependencies = [
    "prometheus-client>=0.22,<1",
]

[project.scripts]
pi-ssd-smart-probe = "pi_ssd_smart_probe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_ssd_smart_probe"]
