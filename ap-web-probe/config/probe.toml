[probe]
# Credentials are intentionally stored in the ignored, root-only directory
# below. The installer rejects a credentials file that is
# readable by group or other users.
credentials_file = "/mnt/data/pi_monitor/.config/ap-web-probe.toml"
metrics_directory = "/mnt/data/pi_monitor/data/node-exporter/textfile"
metrics_filename = "ap-web.prom"
# This root-only local file maps MAC addresses to user-defined display names.
# It is intentionally not part of Git.
device_names_file = "/mnt/data/pi_monitor/.config/device-names.toml"
# Current client inventory stays on the Pi and is replaced only after a
# successful read of each AP. The LAN map checks its collection timestamp.
snapshot_directory = "/mnt/data/pi_monitor/data/ap-web-probe"

[[targets]]
id = "ap1"
address = "192.168.100.246"
# The WAP150 uses a self-signed certificate. Keep this explicit rather than
# silently disabling TLS verification in code.
verify_tls = false
# Rendering the management UI can occasionally take longer than the normal
# response time.  Use the same per-AP wait limit for every target.
timeout_seconds = 90

[[targets]]
id = "ap2"
address = "192.168.100.247"
# AP2 uses the same self-signed HTTPS setup and the same Read Only account.
verify_tls = false
# Keep the whole two-AP run below the service's three-minute timeout.
timeout_seconds = 90
