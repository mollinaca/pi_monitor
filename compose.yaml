name: home-network-monitor

services:
  gatus:
    image: ghcr.io/twin/gatus:v5.36.0
    container_name: network-monitor
    restart: unless-stopped
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/gatus:/config:ro
      - /mnt/data/pi_monitor/data/gatus:/data

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/textfile
    ports:
      - "127.0.0.1:9100:9100"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /:/host:ro,rslave
      - /mnt/data/pi_monitor/data/node-exporter/textfile:/textfile:ro

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      - node-exporter
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /mnt/data/pi_monitor/data/prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    user: "472:0"
    ports:
      - "3001:3000"
    environment:
      GF_SERVER_ROOT_URL: http://192.168.100.201:3001
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - /mnt/data/pi_monitor/data/grafana:/var/lib/grafana
      - /root/.config/pi_monitor/grafana_admin_password:/run/secrets/grafana_admin_password:ro
