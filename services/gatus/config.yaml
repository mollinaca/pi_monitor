metrics: true

storage:
  type: sqlite
  path: /data/gatus.db

endpoints:
  - name: ROUTER
    group: 01-LAN
    url: "icmp://192.168.100.1"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"

  - name: AP-1F
    group: 01-LAN
    url: "icmp://192.168.100.246"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"

  - name: AP-2F
    group: 01-LAN
    url: "icmp://192.168.100.247"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"

  - name: cloudflare-dns-ip
    group: 02-INTERNET
    url: "icmp://1.1.1.1"
    interval: 5m
    conditions:
      - "[CONNECTED] == true"

  - name: cloudflare-dns-query
    group: 02-INTERNET
    url: "1.1.1.1"
    interval: 5m
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
      - "[BODY] == pat(*.*.*.*)"

  - name: yahoo-japan
    group: 02-INTERNET
    url: "https://www.yahoo.co.jp/"
    interval: 5m
    method: HEAD
    conditions:
      - "[STATUS] == 200"
      - "[CONNECTED] == true"

  - name: google
    group: 02-INTERNET
    url: "https://www.google.com/"
    interval: 5m
    method: HEAD
    conditions:
      - "[STATUS] == 200"
      - "[CONNECTED] == true"

  - name: github
    group: 02-INTERNET
    url: "https://github.com/"
    interval: 5m
    method: HEAD
    conditions:
      - "[STATUS] == 200"
      - "[CONNECTED] == true"

  - name: x
    group: 02-INTERNET
    url: "https://x.com/"
    interval: 5m
    method: HEAD
    conditions:
      - "[STATUS] == 200"
      - "[CONNECTED] == true"

  - name: discord
    group: 02-INTERNET
    url: "https://discord.com/"
    interval: 5m
    method: HEAD
    conditions:
      - "[STATUS] == 200"
      - "[CONNECTED] == true"

  # Hetzner's regional speed-test hosts resolve to location-specific servers.
  # Requesting one byte verifies DNS, TCP, TLS, and HTTP without downloading
  # the 100 MB test file.
  - name: us-west-hillsboro
    group: 02-INTERNET
    url: "https://hil-speed.hetzner.com/100MB.bin"
    interval: 5m
    headers:
      Range: "bytes=0-0"
    conditions:
      - "[STATUS] == 206"
      - "[CONNECTED] == true"

  - name: us-east-ashburn
    group: 02-INTERNET
    url: "https://ash-speed.hetzner.com/100MB.bin"
    interval: 5m
    headers:
      Range: "bytes=0-0"
    conditions:
      - "[STATUS] == 206"
      - "[CONNECTED] == true"

  - name: eu-central-falkenstein
    group: 02-INTERNET
    url: "https://fsn1-speed.hetzner.com/100MB.bin"
    interval: 5m
    headers:
      Range: "bytes=0-0"
    conditions:
      - "[STATUS] == 206"
      - "[CONNECTED] == true"

  - name: eu-north-helsinki
    group: 02-INTERNET
    url: "https://hel1-speed.hetzner.com/100MB.bin"
    interval: 5m
    headers:
      Range: "bytes=0-0"
    conditions:
      - "[STATUS] == 206"
      - "[CONNECTED] == true"

  - name: asia-southeast-singapore
    group: 02-INTERNET
    url: "https://sin-speed.hetzner.com/100MB.bin"
    interval: 5m
    headers:
      Range: "bytes=0-0"
    conditions:
      - "[STATUS] == 206"
      - "[CONNECTED] == true"
