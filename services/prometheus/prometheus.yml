global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

storage:
  tsdb:
    retention:
      time: 2y
      size: 10GB

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: raspberry-pi
    # Host and storage metrics are low-churn kernel counters.  One-minute
    # collection is sufficient and avoids retaining unnecessary samples.
    scrape_interval: 1m
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: raspberry-pi
    # SMART and internet speed are collected by dedicated jobs below. Do not
    # store their textfile metrics with the host metrics as well.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: home_ssd_smart_.+|home_internet_speedtest_.+
        action: drop

  - job_name: ssd-smart
    # This reads the already-generated textfile only. The smartctl probe is
    # still run by systemd once daily; five-minute scraping makes a manual
    # validation visible promptly in Grafana without issuing SMART commands.
    scrape_interval: 5m
    scrape_timeout: 15s
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: raspberry-pi
    # Keep this low-frequency job focused on the SMART textfile only.
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: home_ssd_smart_.+
        action: keep

  - job_name: internet-speed
    # The Ookla test is independently scheduled every 30 minutes. This job
    # only reads its textfile output and never generates test traffic itself.
    scrape_interval: 1m
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: raspberry-pi
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: home_internet_speedtest_.+
        action: keep

  - job_name: gatus
    static_configs:
      - targets:
          - gatus:8080
