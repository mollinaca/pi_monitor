groups:
  - name: textfile-freshness
    rules:
      - alert: HomeTextfileStale
        expr: time() - node_textfile_mtime_seconds{job="raspberry-pi",file=~"/textfile/(ap-web|internet-speed|lan-map|router|wifi-ap1_24|wifi-ap1_50|wifi-ap2_24|wifi-ap2_50)\\.prom"} > 86400
        labels:
          severity: warning
        annotations:
          summary: "Textfile has not been updated for 24 hours: {{ $labels.file }}"
          description: "Check the matching systemd timer and service journal on the Pi. No notification receiver is configured."
      - alert: HomeSmartTextfileStale
        expr: time() - node_textfile_mtime_seconds{job="raspberry-pi",file="/textfile/ssd-smart.prom"} > 108000
        labels:
          severity: warning
        annotations:
          summary: "SMART textfile has not been updated for 30 hours"
          description: "Check pi-ssd-smart-probe.timer and its service journal on the Pi. No notification receiver is configured."
      - alert: HomePiThrottlingTextfileStale
        expr: time() - node_textfile_mtime_seconds{job="raspberry-pi",file="/textfile/pi-throttling.prom"} > 600
        labels:
          severity: warning
        annotations:
          summary: "Raspberry Pi throttling textfile has not been updated for 10 minutes"
          description: "Check pi-throttling-probe.timer and its service journal on the Pi. No notification receiver is configured."
      - alert: HomePiThrottlingProbeFailed
        expr: home_pi_throttling_probe_success{job="raspberry-pi"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Raspberry Pi throttling probe has failed for 5 minutes"
          description: "Check pi-throttling-probe.service journal on the Pi. No notification receiver is configured."
