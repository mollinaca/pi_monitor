apiVersion: 1

providers:
  - name: wifi-monitoring
    orgId: 1
    folder: Wi-Fi Monitoring
    folderUid: wifi-monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/wifi

  - name: network-health
    orgId: 1
    folder: Network Health
    folderUid: network-health
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards/gatus
